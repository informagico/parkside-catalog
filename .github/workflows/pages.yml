name: Catalogo statico
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Pubblica su Pages (verificare prima privacy e piano)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-statico
          path: dist
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
